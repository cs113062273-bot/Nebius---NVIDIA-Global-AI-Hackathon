<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio booking / MicroModal historical reproduction</title><link rel="stylesheet" href="style.css"></head><body><main><p>STUDIO A / BOOK A WORKSPACE</p><h1>Keep your place.</h1><p>A booking dialog with an optional retry action.</p><button id="open" data-micromodal-trigger="booking">Reserve Studio A</button><p id="receipt" role="status" hidden></p></main><div id="booking" class="modal" aria-hidden="true"><div id="panel" role="dialog" aria-modal="true" aria-labelledby="title"><h2 id="title">Reserve Studio A</h2><label for="email">Email</label><input id="email" type="text" autocomplete="off"><button id="confirm">Confirm reservation</button><button id="close" data-micromodal-close>Cancel reservation</button><div class="optional-retry"><button id="retry">Try again</button></div></div></div><script type="module" src="app.js"></script></body></html>
