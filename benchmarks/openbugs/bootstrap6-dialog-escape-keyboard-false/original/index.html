<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment confirmation</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="dist/css/bootstrap.min.css">
<style>/* This product opens dialogs without animation. */ .dialog,.dialog::backdrop{transition:none!important}</style>
</head>
<body class="p-4">
<main class="container" style="max-width:40rem">
  <h1 class="h3 mb-3">Transfer 2,400.00 EUR</h1>
  <p>To: Studio Rent Ltd · IBAN ending 4471</p>
  <button type="button" class="btn-solid theme-primary" id="confirm-open">Confirm transfer</button>
  <p class="mt-3">Status: <output id="status">Not sent</output></p>
</main>
<dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-header">
    <h2 class="dialog-title h5" id="confirm-title">Enter the code from your phone</h2>
  </div>
  <div class="dialog-body">
    <p>The transfer is held until you confirm or cancel it.</p>
    <label class="form-label" for="otp">Six-digit code</label>
    <input class="form-control" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code">
  </div>
  <div class="dialog-footer">
    <button type="button" class="btn-solid theme-secondary" id="cancel-transfer" data-bs-dismiss="dialog">Cancel transfer</button>
    <button type="button" class="btn-solid theme-primary" id="send">Send</button>
  </div>
</dialog>
<script type="module">
import Dialog from './js/src/dialog.js';
const status = document.getElementById('status'), otp = document.getElementById('otp');
// The code must be entered or the transfer cancelled explicitly: Escape and backdrop clicks must not dismiss it.
const dialog = Dialog.getOrCreateInstance('#confirm-dialog', { keyboard: false, backdrop: 'static' });
document.getElementById('confirm-open').addEventListener('click', () => dialog.show());
// Move focus once the dialog has finished opening (initial focus is a separate upstream issue, #43120).
document.getElementById('confirm-dialog').addEventListener('shown.bs.dialog', () => otp.focus());
document.getElementById('cancel-transfer').addEventListener('click', () => { status.textContent = 'Cancelled'; });
document.getElementById('send').addEventListener('click', () => { status.textContent = otp.value.length === 6 ? 'Sent' : 'Code required'; if (otp.value.length === 6) dialog.hide(); });
window.__ready = true;
</script>
</body>
</html>
