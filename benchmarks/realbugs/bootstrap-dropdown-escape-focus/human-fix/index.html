<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body class="p-4">
<main class="container" style="max-width:40rem">
  <h1 class="h3 mb-3">Invoice INV-2041</h1>
  <p>Amount due: 1,240.00 EUR</p>
  <div class="dropdown mb-3">
    <button class="btn btn-primary dropdown-toggle" type="button" id="actions-toggle" data-bs-toggle="dropdown" aria-expanded="false">Invoice actions</button>
    <ul class="dropdown-menu" id="actions-menu" aria-labelledby="actions-toggle">
      <li><button class="dropdown-item" type="button" id="action-send" data-action="Sent reminder">Send reminder</button></li>
      <li><button class="dropdown-item" type="button" id="action-download" data-action="Downloaded PDF">Download PDF</button></li>
      <li><button class="dropdown-item" type="button" id="action-archive" data-action="Archived">Archive</button></li>
    </ul>
  </div>
  <p>Last action: <output id="last-action">None</output></p>
  <button class="btn btn-outline-secondary" type="button" id="pay">Record payment</button>
</main>
<script type="module">
import Dropdown from './js/src/dropdown.js';
document.querySelectorAll('[data-action]').forEach(item => item.addEventListener('click', () => {
  document.querySelector('#last-action').textContent = item.dataset.action;
}));
window.__ready = true;
</script>
</body>
</html>
