<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Upload a report</title>
<link rel="icon" href="data:,">
<style>
body{font:18px system-ui,sans-serif;margin:0;padding:32px;color:#111;background:#fff}
button,input{font:inherit}
button{padding:10px 16px}
input{padding:8px;border:1px solid #555}
:focus{outline:3px solid #0050c8;outline-offset:2px}
.modal{display:none}
.modal.is-open{display:block}
.modal__overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.modal__container{background:#fff;padding:24px;max-width:420px;width:90%;border-radius:6px}
.modal__header{display:flex;justify-content:space-between;align-items:center}
.retry{display:none}
footer{margin-top:40px}
</style>
</head>
<body>
<main>
  <h1>Monthly report</h1>
  <p id="status">No report uploaded yet.</p>
  <button id="open" type="button" data-micromodal-trigger="upload-modal">Upload report</button>
</main>
<div class="modal" id="upload-modal" aria-hidden="true">
  <div class="modal__overlay" tabindex="-1" data-micromodal-close>
    <div class="modal__container" role="dialog" aria-modal="true" aria-labelledby="upload-title">
      <div class="modal__header">
        <h2 id="upload-title">Upload report</h2>
        <button id="modal-close" type="button" aria-label="Close upload dialog" data-micromodal-close>&times;</button>
      </div>
      <p><label for="filename">File name</label><br><input id="filename" type="text" value="report.pdf"></p>
      <button id="upload" type="button">Upload</button>
      <button id="retry" class="retry" type="button">Try again</button>
    </div>
  </div>
</div>
<footer><a id="help" href="#help-text">Upload help</a><p id="help-text">Reports must be PDF files.</p></footer>
<script type="module">
import MicroModal from './lib/src/index.js';
MicroModal.init();
document.getElementById('upload').addEventListener('click', () => {
  document.getElementById('status').textContent = 'Uploaded ' + document.getElementById('filename').value + '.';
  MicroModal.close('upload-modal');
});
window.__ready = true;
</script>
</body>
</html>
