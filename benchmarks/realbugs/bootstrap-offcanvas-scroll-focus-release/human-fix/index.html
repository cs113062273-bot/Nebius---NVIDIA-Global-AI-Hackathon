<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense report</title>
<link rel="stylesheet" href="dist/css/bootstrap.min.css">
<style>.offcanvas,.offcanvas-backdrop{transition:none}</style>
<script type="importmap">{"imports":{"/js/src/base-component":"/js/src/base-component.js","/js/src/dom/data":"/js/src/dom/data.js","/js/src/dom/event-handler":"/js/src/dom/event-handler.js","/js/src/dom/manipulator":"/js/src/dom/manipulator.js","/js/src/dom/selector-engine":"/js/src/dom/selector-engine.js","/js/src/util/backdrop":"/js/src/util/backdrop.js","/js/src/util/index":"/js/src/util/index.js","/js/src/util/scrollbar":"/js/src/util/scrollbar.js"}}</script>
</head>
<body class="p-4">
<main class="container" style="max-width:44rem">
  <h1 class="h3 mb-3">Expense report</h1>
  <p>Submit receipts for your March travel. The help panel stays open beside the form while you keep working.</p>
  <button class="btn btn-outline-primary mb-3" type="button" id="open-help" data-bs-toggle="offcanvas" data-bs-target="#help" aria-controls="help">Policy help</button>
  <div class="offcanvas offcanvas-end" data-bs-scroll="true" data-bs-backdrop="false" tabindex="-1" id="help" aria-labelledby="help-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="help-title">Expense policy</h2>
    </div>
    <div class="offcanvas-body">
      <p id="help-text">Meals are reimbursed up to 45 EUR per day. Attach an itemised receipt for anything over 25 EUR.</p>
      <button type="button" class="btn btn-secondary" id="help-close" data-bs-dismiss="offcanvas">Close help</button>
    </div>
  </div>
  <form id="report" class="mt-3">
    <label class="form-label" for="amount">Amount (EUR)</label>
    <input class="form-control mb-3" id="amount" name="amount" value="38.50">
    <button class="btn btn-primary" type="button" id="submit-report">Submit report</button>
  </form>
</main>
<script type="module">
import Offcanvas from './js/src/offcanvas.js';
window.__ready = true;
</script>
</body>
</html>
