<!doctype html>
<html lang="en" class="govuk-template">
<head>
<meta charset="utf-8">
<title>Appointment reminders</title>
<link rel="icon" href="data:,">
<style>
body{margin:0;font:19px/1.3 Arial,sans-serif;color:#0b0c0c;background:#fff}
.govuk-width-container{max-width:960px;margin:0 30px;padding:30px 0}
.govuk-fieldset{border:0;margin:0 0 30px;padding:0}
.govuk-fieldset__legend{font-weight:700;font-size:24px;margin-bottom:15px}
.govuk-radios__item{display:flex;align-items:center;margin-bottom:10px}
.govuk-radios__input{width:28px;height:28px;margin:0 10px 0 0}
.govuk-radios__divider{margin:0 0 10px 6px}
.govuk-radios__conditional{margin:0 0 15px 18px;padding-left:33px;border-left:4px solid #b1b4b6}
.js-enabled .govuk-radios__conditional--hidden{display:none}
.govuk-label{display:block;margin-bottom:5px}
.govuk-input{font:inherit;padding:5px;border:2px solid #0b0c0c;width:320px}
.govuk-button{font:inherit;padding:8px 10px;background:#00703c;color:#fff;border:0;box-shadow:0 2px 0 #002d18}
:focus{outline:3px solid #fd0;outline-offset:0}
</style>
<script type="importmap">
{"imports":{"/src/govuk/vendor/polyfills/Function/prototype/bind":"/src/govuk/vendor/polyfills/Function/prototype/bind.js","/src/govuk/vendor/polyfills/Object/defineProperty":"/src/govuk/vendor/polyfills/Object/defineProperty.js","/src/govuk/vendor/polyfills/Event":"/src/govuk/vendor/polyfills/Event.js","/src/govuk/vendor/polyfills/Window":"/src/govuk/vendor/polyfills/Window.js","/src/govuk/vendor/polyfills/Element":"/src/govuk/vendor/polyfills/Element.js","/src/govuk/vendor/polyfills/Document":"/src/govuk/vendor/polyfills/Document.js","/src/govuk/vendor/polyfills/Element/prototype/classList":"/src/govuk/vendor/polyfills/Element/prototype/classList.js","/src/govuk/vendor/polyfills/DOMTokenList":"/src/govuk/vendor/polyfills/DOMTokenList.js","/src/govuk/common":"/src/govuk/common.js"}}
</script>
</head>
<body class="govuk-template__body js-enabled">
<div class="govuk-width-container">
<main class="govuk-main-wrapper" id="main-content">
<form id="reminder-form" action="#" novalidate>
  <fieldset class="govuk-fieldset">
    <legend class="govuk-fieldset__legend">How should we remind you about your appointment?</legend>
    <!-- Two radios macros share one name: the reminder channels, then a separate opt-out answer. -->
    <div class="govuk-radios govuk-radios--conditional" data-module="govuk-radios" id="channel-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="reminder" name="reminder" type="radio" value="email" data-aria-controls="conditional-reminder">
        <label class="govuk-label govuk-radios__label" for="reminder">Email</label>
      </div>
      <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-reminder">
        <label class="govuk-label" for="reminder-email">Email address</label>
        <input class="govuk-input" id="reminder-email" name="reminder-email" type="email" spellcheck="false" autocomplete="email">
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="reminder-2" name="reminder" type="radio" value="text" data-aria-controls="conditional-reminder-2">
        <label class="govuk-label govuk-radios__label" for="reminder-2">Text message</label>
      </div>
      <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-reminder-2">
        <label class="govuk-label" for="reminder-mobile">Mobile number</label>
        <input class="govuk-input" id="reminder-mobile" name="reminder-mobile" type="tel" autocomplete="tel">
      </div>
    </div>
    <div class="govuk-radios__divider">or</div>
    <div class="govuk-radios" data-module="govuk-radios" id="optout-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="reminder-none" name="reminder" type="radio" value="none">
        <label class="govuk-label govuk-radios__label" for="reminder-none">I do not want reminders</label>
      </div>
    </div>
  </fieldset>
  <button type="button" class="govuk-button" id="continue">Continue</button>
</form>
</main>
</div>
<script type="module">
import Radios from './src/govuk/components/radios/radios.js'
document.querySelectorAll('[data-module="govuk-radios"]').forEach(function ($radios) { new Radios($radios).init() })
</script>
</body>
</html>
