<body class="govuk-template__body js-enabled">
<div class="govuk-width-container">
<main class="govuk-main-wrapper" id="main-content">
<div id="error-summary-slot"></div>
<h1>What is your name?</h1>
<form id="name-form" action="#" novalidate>
  <div class="govuk-form-group">
    <label class="govuk-label" for="full-name">Full name</label>
    <div id="full-name-hint" class="govuk-hint">As it appears on your passport or driving licence</div>
    <input class="govuk-input" id="full-name" name="full-name" type="text" autocomplete="name" aria-describedby="full-name-hint">
  </div>
  <button type="button" class="govuk-button" id="continue">Continue</button>
</form>
</main>
</div>
<script type="module">
import ErrorSummary from './src/components/error-summary/error-summary.js'

// Client-side check: when the name is missing, render the documented error summary
// markup at the top of the page and initialise the component on it.
document.getElementById('continue').addEventListener('click', function () {
  var slot = document.getElementById('error-summary-slot')
  slot.innerHTML = ''
  if (document.getElementById('full-name').value.trim()) return
  var summary = document.createElement('div')
  summary.className = 'govuk-error-summary'
  summary.id = 'error-summary'
  summary.setAttribute('aria-labelledby', 'error-summary-title')
  summary.setAttribute('role', 'alert')
  summary.setAttribute('tabindex', '-1')
  summary.setAttribute('data-module', 'error-summary')
  summary.innerHTML = '<h2 class="govuk-error-summary__title" id="error-summary-title">There is a problem</h2>' +
    '<div class="govuk-error-summary__body"><ul class="govuk-list govuk-error-summary__list">' +
    '<li><a href="#full-name" id="error-full-name">Enter your full name</a></li></ul></div>'
  slot.appendChild(summary)
  new ErrorSummary(summary).init()
})
</script>
</body>
