<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Delivery preferences</title><link rel="stylesheet" href="autocomplete.css"><link rel="stylesheet" href="style.css"></head><body><main><p>ACCOUNT / OPTIONAL SAVED COUNTRIES</p><h1>Where should we deliver?</h1><p>You can change or clear either saved country. Saving must preserve what is visible in each field.</p><form id="preferences"><label for="shipping-country">Shipping country (optional)</label><select id="shipping-country" name="shipping_country">
          <option value="">
            No saved country
          </option>
          <option value="gb" selected>
            United Kingdom
          </option>
          <option value="fr">
            France
          </option></select><label for="billing-country">Billing country (optional)</label><select id="billing-country" name="billing_country">
          <option value="">
            No saved country
          </option>
          <option value="de" selected>
            Germany
          </option>
          <option value="it">
            Italy
          </option></select><button id="save" type="submit">Save delivery preferences</button></form><form id="search" role="search"><label for="destination">Find a pickup city (optional)</label><div id="destination-field"></div></form></main><script src="accessible-autocomplete.js"></script><script src="app.js"></script></body></html>
