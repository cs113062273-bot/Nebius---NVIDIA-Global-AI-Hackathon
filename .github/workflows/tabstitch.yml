name: Tabstitch keyboard check

# Replays the example shop's frozen keyboard task on every pull request that touches it, using
# this repository's own action (action.yml) exactly as another project would. When the task
# breaks, Nemotron on Nebius proposes a patch (Super first, Ultra on rejection), Chromium
# verifies it, and the result is posted on the pull request.
on:
  pull_request:
    paths: ['examples/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  keyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Secrets are never given to pull requests from forks, so those only get the check.
      - uses: ./
        with:
          site: examples/checkout
          tasks: examples/checkout/.tabstitch/tasks.json
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          max-usd: '0.5'
